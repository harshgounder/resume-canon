name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House style across all prose
        run: python3 tools/lint_docs.py .

      - name: Internal links resolve
        run: python3 tools/check_internal_links.py .

      - name: Linter catches a bad resume
        run: |
          if python3 tools/resume_lint.py tools/fixtures/bad-resume.md; then
            echo "expected the bad fixture to fail"; exit 1
          else
            echo "bad fixture correctly failed"
          fi

      - name: Linter passes a good resume
        run: python3 tools/resume_lint.py tools/fixtures/good-resume.md

      - name: Build the LaTeX template
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils
          mkdir -p build
          ./tools/build.sh templates/latex/ats-single-column/resume.tex build

      - name: Parser check on the built PDF
        run: python3 tools/parse_check.py build/resume.pdf

      - name: Install Typst
        run: |
          curl -sL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-*/typst /usr/local/bin/typst
          typst --version

      - name: Build the Typst template
        run: ./tools/build.sh templates/typst/resume.typ build

      - name: Parser check on the Typst PDF
        run: python3 tools/parse_check.py build/typst-resume.pdf

      - name: Build both worked examples
        run: |
          ./tools/build.sh examples/fresher-india/resume.tex build
          ./tools/build.sh examples/senior-engineer/resume.tex build

      - name: Lint both worked examples
        run: |
          python3 tools/resume_lint.py build/resume.pdf
          python3 tools/ats_sim.py build/resume.pdf
